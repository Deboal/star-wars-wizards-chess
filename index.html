<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holochess: Marble & Obsidian — Star Wars 3D Wizard's Chess</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Space Grotesk & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0" />
    <!-- Three.js r128 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- JSZip for 1-Click Antigravity & Netlify Bundle Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        :root {
            --md-surface: rgba(18, 22, 33, 0.85);
            --md-border: rgba(255, 255, 255, 0.14);
            --jedi-cyan: #38bdf8;
            --sith-crimson: #f43f5e;
        }
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at 50% 35%, #162038 0%, #090c15 70%, #05070c 100%);
            font-family: 'Inter', sans-serif;
            color: #f8fafc;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            outline: none;
        }
        .md3-bar {
            background: var(--md-surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--md-border);
            box-shadow: 0 12px 36px -4px rgba(0, 0, 0, 0.7), 0 4px 12px -2px rgba(0, 0, 0, 0.45);
        }
        .md3-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            padding: 0.48rem 0.85rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
            color: #e2e8f0;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
        }
        .md3-btn:hover {
            background: rgba(255, 255, 255, 0.14);
            transform: translateY(-1px);
            border-color: rgba(255, 255, 255, 0.24);
        }
        .md3-btn:active {
            transform: translateY(0px) scale(0.97);
        }
        .md3-btn.active-jedi {
            background: rgba(56, 189, 248, 0.18);
            border-color: rgba(56, 189, 248, 0.55);
            color: #bae6fd;
            box-shadow: 0 0 18px rgba(56, 189, 248, 0.25);
        }
        .md3-btn.accent-amber {
            background: rgba(245, 158, 11, 0.16);
            border-color: rgba(245, 158, 11, 0.45);
            color: #fde68a;
        }
        .md3-btn.accent-amber:hover {
            background: rgba(245, 158, 11, 0.28);
        }
        .md3-btn.accent-emerald {
            background: rgba(16, 185, 129, 0.18);
            border-color: rgba(16, 185, 129, 0.5);
            color: #a7f3d0;
        }
        .md3-btn.accent-emerald:hover {
            background: rgba(16, 185, 129, 0.3);
        }
        .title-font {
            font-family: 'Space Grotesk', sans-serif;
        }
        .material-symbols-rounded {
            font-size: 18px;
            line-height: 1;
        }
    </style>
</head>
<body>

    <!-- 3D Viewport Container -->
    <div id="canvas-container"></div>

    <header class="fixed top-4 left-1/2 -translate-x-1/2 z-20 w-[96%] max-w-6xl pointer-events-none">
        <nav class="md3-bar rounded-3xl px-4 py-2.5 flex flex-wrap items-center justify-between gap-2 pointer-events-auto">
            
            <!-- Left: Brand & Turn Status Chip -->
            <div class="flex items-center gap-2.5 flex-wrap">

                    <span class="material-symbols-rounded text-sky-400">grid_on</span>

                        Dejarik : Wizard's Chess
                    </span>

                <div class="h-4 w-[1px] bg-white/15 hidden sm:block"></div>

                <!-- Dynamic Faction Turn Pill -->
                <div id="turn-badge" class="flex items-center gap-2 px-3 py-1 rounded-full bg-sky-500/15 border border-sky-400/40 text-sky-200 text-xs font-semibold transition-all duration-300">
                    <span id="turn-dot" class="w-2.5 h-2.5 rounded-full bg-sky-400 shadow-[0_0_8px_#38bdf8]"></span>
                    <span id="turn-text">LIGHT SIDE (MARBLE)</span>
                </div>

                <!-- Captured Counters -->
                <div class="flex items-center gap-2.5 px-3 py-1 rounded-full bg-black/40 border border-white/10 text-xs">
                    <div class="flex items-center gap-1" title="Shattered Obsidian Pieces">
                        <span class="w-2 h-2 rounded-full bg-sky-400"></span>

                    <span class="text-white/20">|</span>
                    <div class="flex items-center gap-1" title="Shattered Marble Pieces">

            <!-- Right: Single-Level Action Controls -->
            <div class="flex items-center gap-1.5 flex-wrap ml-auto">
                <!-- Opponent Mode Toggle (vs Droid AI / 2P Local) -->
                <button id="btn-mode" class="md3-btn active-jedi" title="Toggle vs Sith AI or 2-Player Pass & Play">
                    <span class="material-symbols-rounded" id="mode-icon">smart_toy</span>

                <!-- Instant Demo Shatter / Strike Showcase -->

                <!-- Camera Preset Cycle -->
                <button id="btn-camera" class="md3-btn" title="Cycle Camera Angle (Jedi, Sith, Overhead, Cinematic)">

                <button id="btn-export-zip" class="md3-btn accent-emerald" title="Download ready-to-deploy .ZIP bundle (index.html + netlify.toml + README.md)">
                    <span class="material-symbols-rounded">folder_zip</span>
                    <span class="hidden sm:inline" id="export-zip-label">Export .ZIP</span>
                </button>

                <!-- New Match -->
                <button id="btn-reset" class="md3-btn hover:bg-rose-500/20 hover:border-rose-400/40" title="Reset Chessboard">
                    <span class="material-symbols-rounded text-rose-300">restart_alt</span>
                    <span class="hidden sm:inline text-rose-200">New Battle</span>
                </button>
            </div>
        </nav>
    </header>

    <!-- Bottom Minimalist Character Telemetry & Controls Hint -->
    <div class="fixed bottom-4 left-1/2 -translate-x-1/2 z-20 pointer-events-none flex flex-col items-center gap-2 w-[94%] max-w-2xl">
        <div id="combat-banner" class="md3-bar rounded-full px-5 py-2.5 text-xs sm:text-sm font-medium text-center text-slate-100 flex items-center justify-center gap-2.5 transition-all duration-300">
            <span id="banner-icon" class="material-symbols-rounded text-sky-400">swords</span>
            <span id="banner-text">Click any White Marble character to inspect valid moves, or press "Demo Shatter" for instant combat.</span>
        </div>
    </div>

    <!-- End-of-Game Material Dialog -->
    <div id="modal-overlay" class="fixed inset-0 z-30 bg-black/70 backdrop-blur-md hidden items-center justify-center p-4">
        <div class="md3-bar rounded-3xl p-6 sm:p-8 max-w-md w-full border border-white/20 text-center space-y-5">
            <div class="w-14 h-14 rounded-2xl bg-sky-500/20 border border-sky-400/40 flex items-center justify-center mx-auto">
                <span id="modal-icon" class="material-symbols-rounded text-3xl text-sky-300">military_tech</span>
            </div>
            <h2 id="modal-title" class="title-font text-2xl font-bold tracking-wide text-white">VICTORY IN THE FORCE</h2>
            <p id="modal-desc" class="text-sm text-slate-300 leading-relaxed">
                The Dark Side's Obsidian King has been shattered.
            </p>
            <div class="flex items-center justify-center gap-3 pt-2">
                <button id="modal-btn-restart" class="md3-btn active-jedi px-6 py-2.5 text-sm">
                    <span class="material-symbols-rounded">replay</span>
                    <span>Play Again</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        /***********************************************************************
         * 1. SELF-CONTAINED FIDE CHESS ENGINE (ZERO EXTERNAL CDN FAILURES)
         ***********************************************************************/
        class HolochessRulesEngine {
            constructor() {
                this.files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
                this.reset();
            }

            reset() {
                this.grid = Array.from({ length: 8 }, () => Array(8).fill(null));
                this.turnColor = 'w';
                this.history = [];
                this.castling = { wK: true, wQ: true, bK: true, bQ: true };
                this.enPassantTarget = null;

                const backRank = ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'];
                for (let c = 0; c < 8; c++) {
                    this.grid[0][c] = { type: backRank[c], color: 'b' };
                    this.grid[1][c] = { type: 'p', color: 'b' };
                    this.grid[6][c] = { type: 'p', color: 'w' };
                    this.grid[7][c] = { type: backRank[c], color: 'w' };
                }
            }

            sqToRC(sq) {
                const c = sq.charCodeAt(0) - 97;
                const r = 8 - parseInt(sq[1], 10);
                return { r, c };
            }

            rcToSq(r, c) {
                return `${this.files[c]}${8 - r}`;
            }

            inBounds(r, c) {
                return r >= 0 && r < 8 && c >= 0 && c < 8;
            }

            get(sq) {
                const { r, c } = this.sqToRC(sq);
                return this.inBounds(r, c) ? this.grid[r][c] : null;
            }

            board() {
                return this.grid.map(row => row.map(cell => (cell ? { ...cell } : null)));
            }

            turn() {
                return this.turnColor;
            }

            cloneState() {
                return {
                    grid: this.board(),
                    turnColor: this.turnColor,
                    castling: { ...this.castling },
                    enPassantTarget: this.enPassantTarget ? { ...this.enPassantTarget } : null
                };
            }

            restoreState(st) {
                this.grid = st.grid.map(row => row.map(cell => (cell ? { ...cell } : null)));
                this.turnColor = st.turnColor;
                this.castling = { ...st.castling };
                this.enPassantTarget = st.enPassantTarget ? { ...st.enPassantTarget } : null;
            }

            findKing(color) {
                for (let r = 0; r < 8; r++) {
                    for (let c = 0; c < 8; c++) {
                        const p = this.grid[r][c];
                        if (p && p.color === color && p.type === 'k') return { r, c };
                    }
                }
                return null;
            }

            isSquareAttacked(targetR, targetC, byColor) {
                const pawnDir = byColor === 'w' ? -1 : 1;
                const pawnStartR = targetR - pawnDir;
                for (const dc of [-1, 1]) {
                    const pc = targetC + dc;
                    if (this.inBounds(pawnStartR, pc)) {
                        const p = this.grid[pawnStartR][pc];
                        if (p && p.color === byColor && p.type === 'p') return true;
                    }
                }

                const knightOffsets = [
                    [-2, -1], [-2, 1], [-1, -2], [-1, 2],
                    [1, -2], [1, 2], [2, -1], [2, 1]
                ];
                for (const [dr, dc] of knightOffsets) {
                    const nr = targetR + dr, nc = targetC + dc;
                    if (this.inBounds(nr, nc)) {
                        const p = this.grid[nr][nc];
                        if (p && p.color === byColor && p.type === 'n') return true;
                    }
                }

                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        if (dr === 0 && dc === 0) continue;
                        const kr = targetR + dr, kc = targetC + dc;
                        if (this.inBounds(kr, kc)) {
                            const p = this.grid[kr][kc];
                            if (p && p.color === byColor && p.type === 'k') return true;
                        }
                    }
                }

                const orthoDirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
                for (const [dr, dc] of orthoDirs) {
                    let r = targetR + dr, c = targetC + dc;
                    while (this.inBounds(r, c)) {
                        const p = this.grid[r][c];
                        if (p) {
                            if (p.color === byColor && (p.type === 'r' || p.type === 'q')) return true;
                            break;
                        }
                        r += dr; c += dc;
                    }
                }

                const diagDirs = [[-1, -1], [-1, 1], [1, -1], [1, 1]];
                for (const [dr, dc] of diagDirs) {
                    let r = targetR + dr, c = targetC + dc;
                    while (this.inBounds(r, c)) {
                        const p = this.grid[r][c];
                        if (p) {
                            if (p.color === byColor && (p.type === 'b' || p.type === 'q')) return true;
                            break;
                        }
                        r += dr; c += dc;
                    }
                }

                return false;
            }

            in_check(color = this.turnColor) {
                const kingPos = this.findKing(color);
                if (!kingPos) return false;
                const enemy = color === 'w' ? 'b' : 'w';
                return this.isSquareAttacked(kingPos.r, kingPos.c, enemy);
            }

            generatePseudoMovesForSquare(r, c) {
                const p = this.grid[r][c];
                if (!p) return [];
                const moves = [];
                const color = p.color;
                const enemy = color === 'w' ? 'b' : 'w';
                const fromSq = this.rcToSq(r, c);

                const addMove = (toR, toC, flags = 'n') => {
                    moves.push({
                        from: fromSq,
                        to: this.rcToSq(toR, toC),
                        color,
                        piece: p.type,
                        flags
                    });
                };

                if (p.type === 'p') {
                    const dir = color === 'w' ? -1 : 1;
                    const startRank = color === 'w' ? 6 : 1;
                    const promoRank = color === 'w' ? 0 : 7;

                    const r1 = r + dir;
                    if (this.inBounds(r1, c) && !this.grid[r1][c]) {
                        addMove(r1, c, r1 === promoRank ? 'np' : 'n');
                        const r2 = r + dir * 2;
                        if (r === startRank && this.inBounds(r2, c) && !this.grid[r2][c]) {
                            addMove(r2, c, 'b');
                        }
                    }

                    for (const dc of [-1, 1]) {
                        const tc = c + dc;
                        if (!this.inBounds(r1, tc)) continue;
                        const target = this.grid[r1][tc];
                        if (target && target.color === enemy) {
                            addMove(r1, tc, r1 === promoRank ? 'cp' : 'c');
                        } else if (
                            this.enPassantTarget &&
                            this.enPassantTarget.r === r1 &&
                            this.enPassantTarget.c === tc
                        ) {
                            addMove(r1, tc, 'e');
                        }
                    }
                } else if (p.type === 'n') {
                    const offsets = [
                        [-2, -1], [-2, 1], [-1, -2], [-1, 2],
                        [1, -2], [1, 2], [2, -1], [2, 1]
                    ];
                    for (const [dr, dc] of offsets) {
                        const nr = r + dr, nc = c + dc;
                        if (!this.inBounds(nr, nc)) continue;
                        const target = this.grid[nr][nc];
                        if (!target) addMove(nr, nc, 'n');
                        else if (target.color === enemy) addMove(nr, nc, 'c');
                    }
                } else if (p.type === 'b' || p.type === 'r' || p.type === 'q') {
                    const dirs = [];
                    if (p.type === 'b' || p.type === 'q') dirs.push([-1, -1], [-1, 1], [1, -1], [1, 1]);
                    if (p.type === 'r' || p.type === 'q') dirs.push([-1, 0], [1, 0], [0, -1], [0, 1]);

                    for (const [dr, dc] of dirs) {
                        let nr = r + dr, nc = c + dc;
                        while (this.inBounds(nr, nc)) {
                            const target = this.grid[nr][nc];
                            if (!target) {
                                addMove(nr, nc, 'n');
                            } else {
                                if (target.color === enemy) addMove(nr, nc, 'c');
                                break;
                            }
                            nr += dr; nc += dc;
                        }
                    }
                } else if (p.type === 'k') {
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            if (dr === 0 && dc === 0) continue;
                            const nr = r + dr, nc = c + dc;
                            if (!this.inBounds(nr, nc)) continue;
                            const target = this.grid[nr][nc];
                            if (!target) addMove(nr, nc, 'n');
                            else if (target.color === enemy) addMove(nr, nc, 'c');
                        }
                    }

                    const homeR = color === 'w' ? 7 : 0;
                    if (r === homeR && c === 4 && !this.in_check(color)) {
                        const canK = color === 'w' ? this.castling.wK : this.castling.bK;
                        if (
                            canK &&
                            !this.grid[homeR][5] &&
                            !this.grid[homeR][6] &&
                            !this.isSquareAttacked(homeR, 5, enemy) &&
                            !this.isSquareAttacked(homeR, 6, enemy)
                        ) {
                            addMove(homeR, 6, 'k');
                        }
                        const canQ = color === 'w' ? this.castling.wQ : this.castling.bQ;
                        if (
                            canQ &&
                            !this.grid[homeR][3] &&
                            !this.grid[homeR][2] &&
                            !this.grid[homeR][1] &&
                            !this.isSquareAttacked(homeR, 3, enemy) &&
                            !this.isSquareAttacked(homeR, 2, enemy)
                        ) {
                            addMove(homeR, 2, 'q');
                        }
                    }
                }

                return moves;
            }

            moves(options = {}) {
                const legal = [];
                const targetSq = options.square || null;

                for (let r = 0; r < 8; r++) {
                    for (let c = 0; c < 8; c++) {
                        const p = this.grid[r][c];
                        if (!p || p.color !== this.turnColor) continue;
                        const sq = this.rcToSq(r, c);
                        if (targetSq && sq !== targetSq) continue;

                        const pseudo = this.generatePseudoMovesForSquare(r, c);
                        for (const mv of pseudo) {
                            const snapshot = this.cloneState();
                            this.applyMoveRaw(mv);
                            const kingSafe = !this.in_check(p.color);
                            this.restoreState(snapshot);
                            if (kingSafe) legal.push(mv);
                        }
                    }
                }
                return legal;
            }

            applyMoveRaw(mv) {
                const from = this.sqToRC(mv.from);
                const to = this.sqToRC(mv.to);
                const movingPiece = { ...this.grid[from.r][from.c] };

                if (mv.flags.includes('e')) {
                    const epCaptureR = movingPiece.color === 'w' ? to.r + 1 : to.r - 1;
                    this.grid[epCaptureR][to.c] = null;
                }

                if (mv.flags.includes('k')) {
                    this.grid[to.r][5] = this.grid[to.r][7];
                    this.grid[to.r][7] = null;
                } else if (mv.flags.includes('q')) {
                    this.grid[to.r][3] = this.grid[to.r][0];
                    this.grid[to.r][0] = null;
                }

                this.grid[from.r][from.c] = null;
                if (mv.flags.includes('p')) {
                    movingPiece.type = 'q';
                }
                this.grid[to.r][to.c] = movingPiece;

                if (movingPiece.type === 'k') {
                    if (movingPiece.color === 'w') { this.castling.wK = false; this.castling.wQ = false; }
                    else { this.castling.bK = false; this.castling.bQ = false; }
                }
                if (mv.from === 'h1' || mv.to === 'h1') this.castling.wK = false;
                if (mv.from === 'a1' || mv.to === 'a1') this.castling.wQ = false;
                if (mv.from === 'h8' || mv.to === 'h8') this.castling.bK = false;
                if (mv.from === 'a8' || mv.to === 'a8') this.castling.bQ = false;

                if (mv.flags === 'b') {
                    this.enPassantTarget = { r: (from.r + to.r) / 2, c: from.c };
                } else {
                    this.enPassantTarget = null;
                }

                this.turnColor = this.turnColor === 'w' ? 'b' : 'w';
            }

            move(moveInput) {
                const legal = this.moves();
                const match = legal.find(m => m.from === moveInput.from && m.to === moveInput.to);
                if (!match) return null;

                this.history.push(this.cloneState());
                this.applyMoveRaw(match);
                return match;
            }

            undo() {
                if (this.history.length === 0) return null;
                const prev = this.history.pop();
                this.restoreState(prev);
                return true;
            }

            in_checkmate() {
                return this.in_check(this.turnColor) && this.moves().length === 0;
            }

            game_over() {
                return this.moves().length === 0;
            }
        }

        /***********************************************************************
         * 2. STAR WARS CHARACTER LORE & ROLE MAPPING
         ***********************************************************************/
        const STAR_WARS_ROSTER = {
            w: {
                faction: 'Light Side (White Carrara Marble)',
                k: { name: 'Grand Master Yoda', weapon: 'Emerald Lightsaber & Force Mastery', saberColor: 0x22c55e, attackType: 'saber' },
                q: { name: 'Rey Skywalker', weapon: 'Reforged Cyan Lightsaber', saberColor: 0x38bdf8, attackType: 'saber' },
                b: { name: 'Obi-Wan Kenobi', weapon: 'Soresu Blue Lightsaber', saberColor: 0x3b82f6, attackType: 'saber' },
                n: { name: 'Chewbacca', weapon: 'Wookiee Bowcaster Quarrels', saberColor: 0xf97316, attackType: 'blaster' },

        /***********************************************************************
         * 3. SYNTHESIZED WEB AUDIO ENGINE (NO EXTERNAL FILES REQUIRED)
         ***********************************************************************/
        class StarWarsAudioEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                try {
                    if (!this.ctx) {
                        const AudioCtx = window.AudioContext || window.webkitAudioContext;
                        if (AudioCtx) this.ctx = new AudioCtx();
                    }
                    if (this.ctx && this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }
                } catch (err) {
                    // Ignore audio autoplay blocks
                }
            }

            playSelect(isLight) {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = isLight ? 'sine' : 'triangle';
                osc.frequency.setValueAtTime(isLight ? 520 : 190, now);
                osc.frequency.exponentialRampToValueAtTime(isLight ? 780 : 130, now + 0.14);

                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.15);
            }

            playStoneSlide() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(95, now);
                osc.frequency.linearRampToValueAtTime(115, now + 0.35);

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(260, now);

                gain.gain.setValueAtTime(0.01, now);
                gain.gain.linearRampToValueAtTime(0.1, now + 0.08);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.42);
            }

            playSaberSwing() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(135, now);
                osc.frequency.exponentialRampToValueAtTime(290, now + 0.18);
                osc.frequency.exponentialRampToValueAtTime(110, now + 0.38);

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(420, now);

                gain.gain.setValueAtTime(0.01, now);
                gain.gain.linearRampToValueAtTime(0.22, now + 0.15);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.42);
            }

            playBlasterBolt() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(980, now);
                osc.frequency.exponentialRampToValueAtTime(140, now + 0.22);

                gain.gain.setValueAtTime(0.18, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.25);
            }

            playStoneShatter() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const bufferSize = this.ctx.sampleRate * 0.45;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.14));
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(900, now);
                filter.Q.setValueAtTime(1.5, now);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.005, now + 0.45);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start(now);

                [640, 1120, 880, 1480].forEach((freq, idx) => {
                    const shardOsc = this.ctx.createOscillator();
                    const shardGain = this.ctx.createGain();
                    shardOsc.type = 'triangle';
                    const start = now + idx * 0.05;
                    shardOsc.frequency.setValueAtTime(freq, start);
                    shardOsc.frequency.exponentialRampToValueAtTime(freq * 0.6, start + 0.18);
                    shardGain.gain.setValueAtTime(0.08, start);
                    shardGain.gain.exponentialRampToValueAtTime(0.001, start + 0.19);
                    shardOsc.connect(shardGain);
                    shardGain.connect(this.ctx.destination);
                    shardOsc.start(start);
                    shardOsc.stop(start + 0.2);
                });
            }
        }

        /***********************************************************************
         * 4. HIGH-DEFINITION 3D RENDERER (WEBGL2/1 + HD SHADED 3D ENGINE)
         * Eliminates board z-clipping, flat low-poly shading, and dark tile blending
         ***********************************************************************/
        class HighDefCanvas3DRenderer {
            constructor(width, height) {
                this.domElement = document.createElement('canvas');
                this.ctx = this.domElement.getContext('2d', { alpha: false });
                this.width = width;
                this.height = height;
                this.pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
                this.shadowMap = { enabled: true, type: null };
                this.setSize(width, height);

                this._projScreenMatrix = new THREE.Matrix4();
                this._normalMatrix = new THREE.Matrix3();
                this._vA = new THREE.Vector3();
                this._vB = new THREE.Vector3();
                this._vC = new THREE.Vector3();
                this._wA = new THREE.Vector3();
                this._wB = new THREE.Vector3();
                this._wC = new THREE.Vector3();
                this._centroid = new THREE.Vector3();
                this._normal = new THREE.Vector3();
                this._edge1 = new THREE.Vector3();
                this._edge2 = new THREE.Vector3();
                this._viewDir = new THREE.Vector3();
                this._halfVec = new THREE.Vector3();

                // Key, Fill (Jedi Cyan), and Rim (Sith Crimson) directional vectors
                this._keyLight = new THREE.Vector3(0.42, 0.82, 0.38).normalize();
                this._fillLight = new THREE.Vector3(-0.55, 0.45, 0.70).normalize();
                this._backLight = new THREE.Vector3(0.15, 0.55, -0.82).normalize();
            }

            setPixelRatio(dpr) {
                this.pixelRatio = Math.min(dpr || 1, 2);
                this.setSize(this.width, this.height);
            }

            setSize(w, h) {
                this.width = w;
                this.height = h;
                this.domElement.width = Math.max(1, Math.floor(w * this.pixelRatio));
                this.domElement.height = Math.max(1, Math.floor(h * this.pixelRatio));
            }

            projectPoint(vec3, halfW, halfH) {
                const v = vec3.clone().applyMatrix4(this._projScreenMatrix);
                return {
                    x: (v.x + 1) * halfW,
                    y: (-v.y + 1) * halfH,
                    z: v.z,
                    visible: v.z > -1 && v.z < 1
                };
            }

            render(scene, camera) {
                const ctx = this.ctx;
                const W = this.domElement.width;
                const H = this.domElement.height;
                if (!ctx || W === 0 || H === 0) return;

                // 1. Deep Sanctuary Radial Background Gradient
                const bgGrad = ctx.createRadialGradient(W * 0.5, H * 0.38, W * 0.05, W * 0.5, H * 0.5, Math.max(W, H) * 0.75);
                bgGrad.addColorStop(0, '#1a2744');
                bgGrad.addColorStop(0.55, '#0b101e');
                bgGrad.addColorStop(1, '#05070e');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, W, H);

                scene.updateMatrixWorld(true);
                camera.updateMatrixWorld(true);
                this._projScreenMatrix.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);

                const halfW = W * 0.5;
                const halfH = H * 0.5;
                const camPos = camera.position;

                // Multi-Pass Render Buckets to prevent any board/tile/piece sorting overlap:
                // Pass 0: Board Frame & Rim
                // Pass 1: 64 Marble & Obsidian Tiles + Highlights
                // Pass 2: 32 Sculpted Pieces, Weapons & Shards
                const passBuckets = [[], [], []];
                const glowOverlays = [];
                const pieceShadowAnchors = [];

                scene.traverseVisible((obj) => {
                    if (obj.isPoints && obj.geometry) {
                        const posAttr = obj.geometry.attributes.position;
                        if (!posAttr) return;
                        ctx.fillStyle = 'rgba(226, 232, 240, 0.75)';
                        for (let i = 0; i < posAttr.count; i += 2) {
                            this._vA.fromBufferAttribute(posAttr, i).applyMatrix4(obj.matrixWorld);
                            this._vA.applyMatrix4(this._projScreenMatrix);
                            if (this._vA.z > -1 && this._vA.z < 1) {
                                const sx = (this._vA.x + 1) * halfW;
                                const sy = (-this._vA.y + 1) * halfH;
                                const sz = (i % 6 === 0) ? 2.2 : 1.3;
                                ctx.fillRect(sx, sy, sz, sz);
                            }
                        }
                        return;
                    }

                    // Collect soft ground drop-shadow positions for each chess piece root
                    if (obj.userData && obj.userData.square && obj.userData.bodyGroup) {
                        this._vA.setFromMatrixPosition(obj.matrixWorld);
                        pieceShadowAnchors.push(this._vA.clone());
                    }

                    if (!obj.isMesh || !obj.geometry || !obj.material) return;
                    const mat = obj.material;
                    if (mat.transparent && mat.opacity <= 0.02) return;

                    // Determine which render pass this mesh belongs to
                    let passIndex = 2;
                    if (obj.userData && obj.userData.renderPass !== undefined) {
                        passIndex = obj.userData.renderPass;
                    } else if (obj.parent && obj.parent.userData && obj.parent.userData.renderPass !== undefined) {
                        passIndex = obj.parent.userData.renderPass;
                    }

                    const geo = obj.geometry;
                    const pos = geo.attributes.position;
                    if (!pos) return;

                    const index = geo.index;
                    const worldMat = obj.matrixWorld;
                    const baseColor = mat.color ? mat.color : new THREE.Color(0xffffff);
                    const emissive = mat.emissive ? mat.emissive : null;
                    const isEmissiveGlow = mat.isMeshBasicMaterial || (emissive && (emissive.r + emissive.g + emissive.b > 0.25));
                    const roughness = mat.roughness !== undefined ? mat.roughness : 0.3;
                    const metalness = mat.metalness !== undefined ? mat.metalness : 0.1;
                    const alpha = mat.transparent ? (mat.opacity !== undefined ? mat.opacity : 1.0) : 1.0;
                    const isTileTop = Boolean(obj.userData && obj.userData.isTile);

                    const pushTriangle = (i0, i1, i2) => {
                        this._wA.fromBufferAttribute(pos, i0).applyMatrix4(worldMat);
                        this._wB.fromBufferAttribute(pos, i1).applyMatrix4(worldMat);
                        this._wC.fromBufferAttribute(pos, i2).applyMatrix4(worldMat);

                        // Face normal in world space
                        this._edge1.subVectors(this._wB, this._wA);
                        this._edge2.subVectors(this._wC, this._wA);
                        this._normal.crossVectors(this._edge1, this._edge2);
                        const areaSq = this._normal.lengthSq();
                        if (areaSq < 1e-8) return;
                        this._normal.multiplyScalar(1 / Math.sqrt(areaSq));

                        // Centroid in world space
                        this._centroid.copy(this._wA).add(this._wB).add(this._wC).multiplyScalar(0.333333);

                        // View vector from centroid to camera
                        this._viewDir.subVectors(camPos, this._centroid);
                        const camDistSq = this._viewDir.lengthSq();
                        const camDist = Math.sqrt(camDistSq);
                        this._viewDir.multiplyScalar(1 / (camDist || 1));

                        // Backface culling
                        if (mat.side !== THREE.DoubleSide) {
                            if (this._normal.dot(this._viewDir) < -0.05) return;
                        }

                        // Project vertices to clip space
                        this._vA.copy(this._wA).applyMatrix4(this._projScreenMatrix);
                        this._vB.copy(this._wB).applyMatrix4(this._projScreenMatrix);
                        this._vC.copy(this._wC).applyMatrix4(this._projScreenMatrix);

                        if (this._vA.z < -1 || this._vA.z > 1 || this._vB.z < -1 || this._vB.z > 1 || this._vC.z < -1 || this._vC.z > 1) return;

                        let r = baseColor.r, g = baseColor.g, b = baseColor.b;

                        if (!isEmissiveGlow) {
                            // Blinn-Phong + Hemisphere + Dual Faction Rim Shading
                            const nDotKey = Math.max(0, this._normal.dot(this._keyLight));
                            const nDotFill = Math.max(0, this._normal.dot(this._fillLight));
                            const nDotBack = Math.max(0, this._normal.dot(this._backLight));
                            const hemiFactor = this._normal.y * 0.5 + 0.5;

                            // Ambient + Hemisphere sky/ground blend
                            const ambient = 0.34 + hemiFactor * 0.24;
                            const diffuse = nDotKey * 0.72 + nDotFill * 0.22 + nDotBack * 0.18;

                            // Specular highlight (Blinn-Phong half-vector)
                            this._halfVec.addVectors(this._keyLight, this._viewDir).normalize();
                            const nDotH = Math.max(0, this._normal.dot(this._halfVec));
                            const shininess = Math.max(8, (1.0 - roughness) * 96);
                            const specStrength = (1.0 - roughness * 0.75) * (0.35 + metalness * 0.65);
                            const spec = Math.pow(nDotH, shininess) * specStrength;

                            // Fresnel rim highlight for sculpted stone depth
                            const fresnel = Math.pow(1.0 - Math.max(0, this._normal.dot(this._viewDir)), 3) * 0.22;

                            const lightMul = ambient + diffuse;
                            r = Math.min(1, r * lightMul + spec * 0.95 + fresnel * (0.65 + nDotFill * 0.35));
                            g = Math.min(1, g * lightMul + spec * 0.96 + fresnel * (0.75 + nDotFill * 0.25));
                            b = Math.min(1, b * lightMul + spec * 1.00 + fresnel * (0.95));
                        } else if (emissive) {
                            r = Math.min(1, r * 0.45 + emissive.r * 0.95);
                            g = Math.min(1, g * 0.45 + emissive.g * 0.95);
                            b = Math.min(1, b * 0.45 + emissive.b * 0.95);
                        }

                        const ri = (r * 255) | 0;
                        const gi = (g * 255) | 0;
                        const bi = (b * 255) | 0;
                        const fillStyle = alpha < 0.99
                            ? `rgba(${ri},${gi},${bi},${alpha.toFixed(2)})`
                            : `rgb(${ri},${gi},${bi})`;

                        const triData = {
                            x1: (this._vA.x + 1) * halfW,
                            y1: (-this._vA.y + 1) * halfH,
                            x2: (this._vB.x + 1) * halfW,
                            y2: (-this._vB.y + 1) * halfH,
                            x3: (this._vC.x + 1) * halfW,
                            y3: (-this._vC.y + 1) * halfH,
                            distSq: camDistSq,
                            fillStyle,
                            strokeStyle: isTileTop && this._normal.y > 0.8
                                ? 'rgba(148, 163, 184, 0.28)'
                                : fillStyle,
                            lineWidth: isTileTop && this._normal.y > 0.8 ? 1.1 : 0.55,
                            isEmissiveGlow
                        };

                        passBuckets[passIndex].push(triData);

                        if (isEmissiveGlow && passIndex === 2) {
                            glowOverlays.push(triData);
                        }
                    };

                    if (index) {
                        const arr = index.array;
                        for (let i = 0; i < arr.length; i += 3) {
                            pushTriangle(arr[i], arr[i + 1], arr[i + 2]);
                        }
                    } else {
                        for (let i = 0; i < pos.count; i += 3) {
                            pushTriangle(i, i + 1, i + 2);
                        }
                    }
                });

                ctx.lineJoin = 'round';

                // Render Pass 0 (Frame) & Pass 1 (64 Board Tiles & Highlights)
                for (let p = 0; p <= 1; p++) {
                    const bucket = passBuckets[p];
                    bucket.sort((a, b) => b.distSq - a.distSq);
                    for (let i = 0; i < bucket.length; i++) {
                        const t = bucket[i];
                        ctx.fillStyle = t.fillStyle;
                        ctx.strokeStyle = t.strokeStyle;
                        ctx.lineWidth = t.lineWidth;
                        ctx.beginPath();
                        ctx.moveTo(t.x1, t.y1);
                        ctx.lineTo(t.x2, t.y2);
                        ctx.lineTo(t.x3, t.y3);
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();
                    }
                }

                // Render Soft Ground Contact Shadows under all 32 Pieces before drawing Pass 2
                for (let i = 0; i < pieceShadowAnchors.length; i++) {
                    const anchor = pieceShadowAnchors[i];
                    const pCenter = this.projectPoint(new THREE.Vector3(anchor.x, 0.02, anchor.z), halfW, halfH);
                    const pEdge = this.projectPoint(new THREE.Vector3(anchor.x + 0.88, 0.02, anchor.z), halfW, halfH);
                    if (pCenter.visible) {
                        const rad = Math.max(6, Math.hypot(pEdge.x - pCenter.x, pEdge.y - pCenter.y));
                        const shGrad = ctx.createRadialGradient(pCenter.x, pCenter.y, rad * 0.1, pCenter.x, pCenter.y, rad);
                        shGrad.addColorStop(0, 'rgba(2, 6, 23, 0.72)');
                        shGrad.addColorStop(0.65, 'rgba(2, 6, 23, 0.32)');
                        shGrad.addColorStop(1, 'rgba(2, 6, 23, 0)');
                        ctx.fillStyle = shGrad;
                        ctx.beginPath();
                        ctx.ellipse(pCenter.x, pCenter.y, rad, rad * 0.62, 0, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                // Render Pass 2 (32 Sculpted Marble & Obsidian Pieces + Shards)
                const pieceBucket = passBuckets[2];
                pieceBucket.sort((a, b) => b.distSq - a.distSq);
                for (let i = 0; i < pieceBucket.length; i++) {
                    const t = pieceBucket[i];
                    ctx.fillStyle = t.fillStyle;
                    ctx.strokeStyle = t.strokeStyle;
                    ctx.lineWidth = t.lineWidth;
                    ctx.beginPath();
                    ctx.moveTo(t.x1, t.y1);
                    ctx.lineTo(t.x2, t.y2);
                    ctx.lineTo(t.x3, t.y3);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                }

                // Additive Bloom Pass for Lightsabers, Blaster Bolts & Holotable Rings
                if (glowOverlays.length > 0) {
                    ctx.save();
                    ctx.globalCompositeOperation = 'lighter';
                    ctx.globalAlpha = 0.28;
                    for (let i = 0; i < glowOverlays.length; i++) {
                        const t = glowOverlays[i];
                        ctx.strokeStyle = t.fillStyle;
                        ctx.lineWidth = 4.5 * this.pixelRatio;
                        ctx.beginPath();
                        ctx.moveTo(t.x1, t.y1);
                        ctx.lineTo(t.x2, t.y2);
                        ctx.lineTo(t.x3, t.y3);
                        ctx.closePath();
                        ctx.stroke();
                    }
                    ctx.restore();
                }
            }
        }

        function createResilientRenderer(width, height) {
            // Tier 1: Direct THREE.WebGLRenderer (supports WebGL2 & WebGL1 natively)
            const webglConfigs = [
                { antialias: true, alpha: false, powerPreference: 'high-performance' },
                { antialias: true, alpha: false },
                { antialias: false, alpha: false, failIfMajorPerformanceCaveat: false }
            ];

            for (const cfg of webglConfigs) {
                try {
                    const webglRenderer = new THREE.WebGLRenderer(cfg);
                    if (webglRenderer && webglRenderer.getContext()) {
                        webglRenderer.setSize(width, height);
                        webglRenderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
                        webglRenderer.shadowMap.enabled = true;
                        webglRenderer.shadowMap.type = THREE.PCFSoftShadowMap;
                        webglRenderer.toneMapping = THREE.ACESFilmicToneMapping;
                        webglRenderer.toneMappingExposure = 1.15;
                        return { renderer: webglRenderer, isFallback: false };
                    }
                } catch (e) {
                    // Continue to next configuration
                }
            }

            // Tier 2: High-Definition Blinn-Phong 3D Software Renderer
            const hdFallback = new HighDefCanvas3DRenderer(width, height);
            hdFallback.setPixelRatio(window.devicePixelRatio || 1);
            return { renderer: hdFallback, isFallback: true };
        }

        /***********************************************************************
         * 5. PROCEDURAL MARBLE & OBSIDIAN TEXTURE GENERATOR
         ***********************************************************************/
        function createProceduralStoneTexture(isMarble) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = isMarble ? '#f8fafc' : '#181c28';
            ctx.fillRect(0, 0, 512, 512);

            const veinCount = isMarble ? 28 : 36;
            for (let i = 0; i < veinCount; i++) {
                ctx.beginPath();
                let x = Math.random() * 512;
                let y = Math.random() * 512;
                ctx.moveTo(x, y);
                const steps = 12 + Math.floor(Math.random() * 14);
                for (let s = 0; s < steps; s++) {
                    x += (Math.random() - 0.5) * 90;
                    y += (Math.random() - 0.5) * 90;
                    ctx.lineTo(x, y);
                }
                if (isMarble) {
                    ctx.strokeStyle = i % 4 === 0
                        ? 'rgba(148, 163, 184, 0.42)'
                        : 'rgba(100, 116, 139, 0.25)';
                    ctx.lineWidth = 1 + Math.random() * 3.5;
                } else {
                    ctx.strokeStyle = i % 4 === 0
                        ? 'rgba(244, 63, 94, 0.38)'
                        : 'rgba(71, 85, 105, 0.4)';
                    ctx.lineWidth = 1 + Math.random() * 2.5;
                }
                ctx.stroke();
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        const marbleTexture = createProceduralStoneTexture(true);
        const obsidianTexture = createProceduralStoneTexture(false);

        const MARBLE_MATERIAL = new THREE.MeshStandardMaterial({
            color: 0xf1f5f9,
            map: marbleTexture,
            roughness: 0.22,
            metalness: 0.08
        });

        const MARBLE_GOLD_ACCENT = new THREE.MeshStandardMaterial({

        /***********************************************************************
         * 6. HIGH-RESOLUTION 3D STAR WARS SCULPTED PIECE FACTORY (32 PIECES)
         ***********************************************************************/
        const SQUARE_SIZE = 2.1;
        const BOARD_OFFSET = (8 * SQUARE_SIZE) / 2 - SQUARE_SIZE / 2;

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const initWidth = container.clientWidth || window.innerWidth || 1024;

        const camera = new THREE.PerspectiveCamera(40, initWidth / initHeight, 0.1, 250);
        const { renderer, isFallback: USING_SOFTWARE_3D } = createResilientRenderer(initWidth, initHeight);

        // High-resolution radial segment counts for smooth silhouettes in both WebGL & HD Software 3D
        const SEG_HI = USING_SOFTWARE_3D ? 18 : 28;
        const SEG_MD = USING_SOFTWARE_3D ? 14 : 22;
        const SEG_LO = USING_SOFTWARE_3D ? 10 : 16;

        // Helper to build smooth LatheGeometry robes/armors from 2D [radius, height] profile points
        function createSculptedLathe(profilePairs, segments = SEG_HI) {
            const pts = profilePairs.map(([r, y]) => new THREE.Vector2(r, y));
            const geo = new THREE.LatheGeometry(pts, segments);
            geo.computeVertexNormals();
            return geo;
        }

        function squareToWorld(squareStr) {
            const file = squareStr.charCodeAt(0) - 97;
            const rank = 8 - parseInt(squareStr[1], 10);
            return new THREE.Vector3(
                file * SQUARE_SIZE - BOARD_OFFSET,
                0,
                rank * SQUARE_SIZE - BOARD_OFFSET
            );
        }

        function createCharacterPieceMesh(type, color) {
            const isLight = color === 'w';
            const stoneMat = isLight ? MARBLE_MATERIAL : OBSIDIAN_MATERIAL;

            const glowMat = new THREE.MeshStandardMaterial({

            // White core blade for authentic lightsaber look

            // 1. Multi-Tiered Sculpted Classical Chess Pedestal Base

            const weaponPivot = new THREE.Group();

        const activeShards = [];

        function spawnEnergyBolt(fromPos, toPos, colorHex) {
