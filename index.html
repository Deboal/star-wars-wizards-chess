        /***********************************************************************
         * 9. CHESS STATE, PIECE REGISTRY & ANIMATION SEQUENCER
         ***********************************************************************/
        const chess = new HolochessRulesEngine();
        const pieceMeshes = {};
        let selectedSquare = null;
        let legalMovesForSelected = [];
        let isAnimatingAction = false;
        let vsDroidAI = true;
        let capturedByLight = 0;
        let capturedByDark = 0;

        function clearAllPiecesFromScene() {
            Object.keys(pieceMeshes).forEach(sq => {
                scene.remove(pieceMeshes[sq]);
                delete pieceMeshes[sq];
            });
        }

        function syncPiecesWithBoard() {
            clearAllPiecesFromScene();
            const board = chess.board();
            for (let r = 0; r < 8; r++) {
                for (let f = 0; f < 8; f++) {
                    const cell = board[r][f];
                    if (cell) {
                        const sq = `${files[f]}${8 - r}`;
                        const mesh = createCharacterPieceMesh(cell.type, cell.color);
                        const pos = squareToWorld(sq);
                        mesh.position.copy(pos);
                        mesh.userData.square = sq;
                        scene.add(mesh);
                        pieceMeshes[sq] = mesh;
                    }
                }
            }
        }

        function clearHighlights() {
            Object.keys(highlightMeshes).forEach(sq => {
                highlightMeshes[sq].visible = false;
            });
        }

        function showHighlightsForSquare(square) {
            clearHighlights();
            legalMovesForSelected = chess.moves({ square });

            if (highlightMeshes[square]) {
                const hl = highlightMeshes[square];
                hl.visible = true;
                hl.userData.ringMat.color.setHex(0xfacc15);
                hl.userData.padMat.color.setHex(0xfacc15);
            }

            legalMovesForSelected.forEach(mv => {
                const hl = highlightMeshes[mv.to];
                if (hl) {
                    hl.visible = true;
                    const isCapture = mv.flags.includes('c') || mv.flags.includes('e');
                    const col = isCapture ? 0xf43f5e : 0x38bdf8;
                    hl.userData.ringMat.color.setHex(col);
                    hl.userData.padMat.color.setHex(col);
                }
            });
        }

        let currentChoreography = null;

        function executeChoreographedMove(moveObj) {
            if (isAnimatingAction) return;
            isAnimatingAction = true;
            clearHighlights();
            selectedSquare = null;

            const fromSq = moveObj.from;
            const toSq = moveObj.to;
            const attackerMesh = pieceMeshes[fromSq];
            let defenderMesh = pieceMeshes[toSq];

            let captureSq = toSq;
            if (moveObj.flags.includes('e')) {
                const epRank = moveObj.color === 'w' ? '5' : '4';
                captureSq = `${toSq[0]}${epRank}`;
                defenderMesh = pieceMeshes[captureSq];
            }

            const startPos = squareToWorld(fromSq);
            const targetPos = squareToWorld(toSq);
            const isCapture = Boolean(defenderMesh);
            const charData = attackerMesh.userData.charData;
            const isRanged = charData.attackType === 'blaster' || charData.attackType === 'lightning';

            const appliedMove = chess.move({ from: fromSq, to: toSq });

            const dirVec = new THREE.Vector3().subVectors(targetPos, startPos);
            const targetAngle = Math.atan2(dirVec.x, dirVec.z);
            attackerMesh.userData.bodyGroup.rotation.y = targetAngle;

            const bannerText = document.getElementById('banner-text');
            if (isCapture && defenderMesh) {
                const victimData = defenderMesh.userData.charData;
                bannerText.textContent = `${charData.name} strikes ${victimData.name} with ${charData.weapon} — SHATTERING stone!`;
            } else {
                bannerText.textContent = `${charData.name} glides across the Holotable to sector ${toSq.toUpperCase()}.`;
            }

            soundFX.playStoneSlide();

            currentChoreography = {
                attackerMesh,
                defenderMesh,
                fromSq,
                toSq,
                captureSq,
                startPos,
                targetPos,
                isCapture,
                isRanged,
                charData,
                appliedMove,
                elapsed: 0,
                boltSpawned: false,
                shattered: false,
                duration: isCapture ? 1.15 : 0.58
            };
        }

        function finalizeChoreography(choreo) {
            const { attackerMesh, defenderMesh, fromSq, toSq, captureSq, targetPos, appliedMove } = choreo;

            if (defenderMesh) {
                scene.remove(defenderMesh);
                delete pieceMeshes[captureSq];
                if (appliedMove.color === 'w') capturedByLight++;
                else capturedByDark++;
            }

            delete pieceMeshes[fromSq];
            pieceMeshes[toSq] = attackerMesh;
            attackerMesh.position.copy(targetPos);
            attackerMesh.userData.square = toSq;
            attackerMesh.userData.bodyGroup.rotation.y = attackerMesh.userData.baseRotationY;
            attackerMesh.userData.weaponPivot.rotation.set(0.2, 0, 0);

            if (appliedMove.flags.includes('k') || appliedMove.flags.includes('q')) {
                const rank = appliedMove.color === 'w' ? '1' : '8';
                const rookFrom = appliedMove.flags.includes('k') ? `h${rank}` : `a${rank}`;
                const rookTo = appliedMove.flags.includes('k') ? `f${rank}` : `d${rank}`;
                const rookMesh = pieceMeshes[rookFrom];
                if (rookMesh) {
                    delete pieceMeshes[rookFrom];
                    pieceMeshes[rookTo] = rookMesh;
                    rookMesh.position.copy(squareToWorld(rookTo));
                    rookMesh.userData.square = rookTo;
                }
            }

            if (appliedMove.flags.includes('p')) {
                scene.remove(attackerMesh);
                const promotedQueen = createCharacterPieceMesh('q', appliedMove.color);
                promotedQueen.position.copy(targetPos);
                promotedQueen.userData.square = toSq;
                scene.add(promotedQueen);
                pieceMeshes[toSq] = promotedQueen;
            }

            currentChoreography = null;
            isAnimatingAction = false;
            updateUIStatus();

            if (!chess.game_over() && vsDroidAI && chess.turn() === 'b') {
                setTimeout(triggerSithAIMove, 450);
            }
        }

        /***********************************************************************
         * 10. TACTICAL SITH DROID AI & DEMO SHATTER TRIGGER
         ***********************************************************************/
        const PIECE_VALUES = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };

        function evaluateBoardMaterial() {
            const b = chess.board();
            let score = 0;
            for (let r = 0; r < 8; r++) {
                for (let f = 0; f < 8; f++) {
                    const p = b[r][f];
                    if (p) {
                        const val = PIECE_VALUES[p.type] || 0;
                        const centerBonus = (r >= 2 && r <= 5 && f >= 2 && f <= 5) ? 16 : 0;
                        score += p.color === 'b' ? (val + centerBonus) : -(val + centerBonus);
                    }
                }
            }
            return score;
        }

        function triggerSithAIMove() {
            if (chess.game_over() || isAnimatingAction || chess.turn() !== 'b') return;

            const legalMoves = chess.moves();
            if (legalMoves.length === 0) return;

            let bestMove = legalMoves[0];
            let bestScore = -Infinity;

            legalMoves.forEach(mv => {
                const snap = chess.cloneState();
                chess.applyMoveRaw(mv);
                let score = evaluateBoardMaterial() + (Math.random() * 24 - 12);
                if (mv.flags.includes('c') || mv.flags.includes('e')) {
                    score += 65;
                }
                if (chess.in_check('w')) {
                    score += 35;
                }
                chess.restoreState(snap);

                if (score > bestScore) {
                    bestScore = score;
                    bestMove = mv;
                }
            });

            executeChoreographedMove(bestMove);
        }

        function triggerDemoShatterAction() {
            if (isAnimatingAction || chess.game_over()) return;

            const legalMoves = chess.moves();
            const captureMoves = legalMoves.filter(m => m.flags.includes('c') || m.flags.includes('e'));

            if (captureMoves.length > 0) {
                const chosen = captureMoves[Math.floor(Math.random() * captureMoves.length)];
                executeChoreographedMove(chosen);
            } else {
                const forwardMoves = legalMoves.filter(m => ['d4', 'e4', 'd5', 'e5', 'c3', 'f3', 'c6', 'f6'].includes(m.to));
                const moveChoice = forwardMoves.length > 0
                    ? forwardMoves[Math.floor(Math.random() * forwardMoves.length)]
                    : legalMoves[Math.floor(Math.random() * legalMoves.length)];

                const destWorld = squareToWorld(moveChoice.to);
                soundFX.playStoneShatter();
                spawnShatterExplosion(destWorld, chess.turn() === 'w' ? 'b' : 'w');
                executeChoreographedMove(moveChoice);
            }
        }

        /***********************************************************************
         * 11. CAMERA ORBIT CONTROLS & RAYCAST INTERACTION
         ***********************************************************************/
        const cameraState = {
            theta: 0,
            phi: 0.80,
            radius: 23.0,
            targetTheta: 0,
            targetPhi: 0.80,
            targetRadius: 23.0,
            presetIndex: 0
        };

        const CAMERA_PRESETS = [
            { name: 'Jedi View', theta: 0, phi: 0.80, radius: 23.0 },
            { name: 'Sith View', theta: Math.PI, phi: 0.80, radius: 23.0 },
            { name: 'Holotable Top', theta: 0, phi: 0.22, radius: 25.5 },
            { name: 'Cinematic Flank', theta: Math.PI / 3.2, phi: 0.96, radius: 21.0 }
        ];

        let isDraggingCamera = false;
        let pointerDownPos = { x: 0, y: 0 };
        let lastPointerPos = { x: 0, y: 0 };

        const raycaster = new THREE.Raycaster();
        const pointerNDC = new THREE.Vector2();

        function getClickedBoardSquare(clientX, clientY) {
            const rect = renderer.domElement.getBoundingClientRect();
            pointerNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            pointerNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(pointerNDC, camera);

            const pieceRoots = Object.values(pieceMeshes);
            const pieceIntersects = raycaster.intersectObjects(pieceRoots, true);
            if (pieceIntersects.length > 0) {
                let obj = pieceIntersects[0].object;
                while (obj && !obj.userData.square) {
                    obj = obj.parent;
                }
                if (obj && obj.userData.square) return obj.userData.square;
            }

            const tileList = Object.values(squareMeshes);
            const tileIntersects = raycaster.intersectObjects(tileList, false);
            if (tileIntersects.length > 0) {
                return tileIntersects[0].object.userData.square;
            }

            return null;
        }

        function handleSquareSelection(sq) {
            if (!sq || isAnimatingAction || chess.game_over()) return;
            if (vsDroidAI && chess.turn() === 'b') return;

            if (selectedSquare) {
                const matchingMove = legalMovesForSelected.find(m => m.to === sq);
                if (matchingMove) {
                    executeChoreographedMove(matchingMove);
                    return;
                }
            }

            const pieceOnSq = chess.get(sq);
            if (pieceOnSq && pieceOnSq.color === chess.turn()) {
                selectedSquare = sq;
                soundFX.playSelect(pieceOnSq.color === 'w');
                showHighlightsForSquare(sq);

                const charInfo = STAR_WARS_ROSTER[pieceOnSq.color][pieceOnSq.type];
                document.getElementById('banner-text').textContent =
                    `${charInfo.name} (${sq.toUpperCase()}) • ${charInfo.weapon} — Select a highlighted tile to move or strike.`;
            } else {
                selectedSquare = null;
                legalMovesForSelected = [];
                clearHighlights();
            }
        }

        renderer.domElement.addEventListener('mousedown', (e) => {
            isDraggingCamera = true;
            pointerDownPos = { x: e.clientX, y: e.clientY };
            lastPointerPos = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDraggingCamera) return;
            const dx = e.clientX - lastPointerPos.x;
            const dy = e.clientY - lastPointerPos.y;
            lastPointerPos = { x: e.clientX, y: e.clientY };

            cameraState.targetTheta -= dx * 0.0065;
            cameraState.targetPhi = Math.max(0.2, Math.min(1.38, cameraState.targetPhi - dy * 0.0055));
        });

        window.addEventListener('mouseup', (e) => {
            if (!isDraggingCamera) return;
            isDraggingCamera = false;
            const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
            if (dist < 6) {
                const sq = getClickedBoardSquare(e.clientX, e.clientY);
                handleSquareSelection(sq);
            }
        });

        renderer.domElement.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDraggingCamera = true;
                pointerDownPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                lastPointerPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
        }, { passive: true });

        renderer.domElement.addEventListener('touchmove', (e) => {
            if (!isDraggingCamera || e.touches.length !== 1) return;
            const dx = e.touches[0].clientX - lastPointerPos.x;
            const dy = e.touches[0].clientY - lastPointerPos.y;
            lastPointerPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };

            cameraState.targetTheta -= dx * 0.0065;
            cameraState.targetPhi = Math.max(0.2, Math.min(1.38, cameraState.targetPhi - dy * 0.0055));
        }, { passive: true });

        renderer.domElement.addEventListener('touchend', (e) => {
            if (!isDraggingCamera) return;
            isDraggingCamera = false;
            const touch = e.changedTouches[0];
            if (touch) {
                const dist = Math.hypot(touch.clientX - pointerDownPos.x, touch.clientY - pointerDownPos.y);
                if (dist < 10) {
                    const sq = getClickedBoardSquare(touch.clientX, touch.clientY);
                    handleSquareSelection(sq);
                }
            }
        });

        renderer.domElement.addEventListener('wheel', (e) => {
            cameraState.targetRadius = Math.max(13, Math.min(34, cameraState.targetRadius + e.deltaY * 0.012));
        }, { passive: true });

        /***********************************************************************
         * 12. UI NAVIGATION BAR CONTROLS & MAIN ANIMATION LOOP
         ***********************************************************************/
        function updateUIStatus() {
            const turn = chess.turn();
            const turnBadge = document.getElementById('turn-badge');
            const turnDot = document.getElementById('turn-dot');
            const turnText = document.getElementById('turn-text');
            const borderMat = borderGlow.material;

            document.getElementById('captured-by-light').textContent = capturedByLight;
            document.getElementById('captured-by-dark').textContent = capturedByDark;

            if (turn === 'w') {
                turnBadge.className = 'flex items-center gap-2 px-3 py-1 rounded-full bg-sky-500/15 border border-sky-400/40 text-sky-200 text-xs font-semibold transition-all duration-300';
                turnDot.className = 'w-2.5 h-2.5 rounded-full bg-sky-400 shadow-[0_0_8px_#38bdf8]';
                turnText.textContent = chess.in_check('w') ? 'LIGHT SIDE • IN CHECK!' : 'LIGHT SIDE (MARBLE)';
                borderMat.color.setHex(0x38bdf8);
                borderMat.emissive.setHex(0x38bdf8);
            } else {
                turnBadge.className = 'flex items-center gap-2 px-3 py-1 rounded-full bg-rose-500/15 border border-rose-400/40 text-rose-200 text-xs font-semibold transition-all duration-300';
                turnDot.className = 'w-2.5 h-2.5 rounded-full bg-rose-500 shadow-[0_0_8px_#f43f5e]';
                turnText.textContent = chess.in_check('b') ? 'DARK SIDE • IN CHECK!' : 'DARK SIDE (OBSIDIAN)';
                borderMat.color.setHex(0xf43f5e);
                borderMat.emissive.setHex(0xf43f5e);
            }

            if (chess.game_over()) {
                const modal = document.getElementById('modal-overlay');
                const title = document.getElementById('modal-title');
                const desc = document.getElementById('modal-desc');
                modal.classList.remove('hidden');
                modal.classList.add('flex');

                if (chess.in_checkmate()) {
                    const winner = turn === 'w' ? 'DARK SIDE (OBSIDIAN)' : 'LIGHT SIDE (MARBLE)';
                    title.textContent = `${winner} TRIUMPHS`;
                    desc.textContent = turn === 'w'
                        ? 'Emperor Palpatine and the Sith Order have shattered the Jedi Sanctuary.'
                        : 'Grand Master Yoda and the Light Side have brought balance to the Force.';
                } else {
                    title.textContent = 'BALANCE IN THE FORCE (STALEMATE)';
                    desc.textContent = 'Neither Light nor Dark could claim dominion over the Dejarik Sanctuary.';
                }
            }
        }

        document.getElementById('btn-mode').addEventListener('click', () => {
            vsDroidAI = !vsDroidAI;
            const btn = document.getElementById('btn-mode');
            const label = document.getElementById('mode-label');
            const icon = document.getElementById('mode-icon');
            if (vsDroidAI) {
                btn.classList.add('active-jedi');
                label.textContent = 'VS Sith AI';
                icon.textContent = 'smart_toy';
                if (chess.turn() === 'b' && !isAnimatingAction && !chess.game_over()) {
                    triggerSithAIMove();
                }
            } else {
                btn.classList.remove('active-jedi');
                label.textContent = '2P Pass & Play';
                icon.textContent = 'group';
            }
        });

        document.getElementById('btn-demo-shatter').addEventListener('click', triggerDemoShatterAction);

        document.getElementById('btn-camera').addEventListener('click', () => {
            cameraState.presetIndex = (cameraState.presetIndex + 1) % CAMERA_PRESETS.length;
            const preset = CAMERA_PRESETS[cameraState.presetIndex];
            cameraState.targetTheta = preset.theta;
            cameraState.targetPhi = preset.phi;
            cameraState.targetRadius = preset.radius;
            document.getElementById('camera-label').textContent = preset.name;
        });

        document.getElementById('btn-undo').addEventListener('click', () => {
            if (isAnimatingAction) return;
            if (vsDroidAI) {
                chess.undo();
                chess.undo();
            } else {
                chess.undo();
            }
            clearHighlights();
            selectedSquare = null;
            syncPiecesWithBoard();
            updateUIStatus();
            document.getElementById('banner-text').textContent = 'Time reversed through the World Between Worlds.';
        });

        document.getElementById('btn-sound').addEventListener('click', () => {
            soundFX.enabled = !soundFX.enabled;
            document.getElementById('sound-icon').textContent = soundFX.enabled ? 'volume_up' : 'volume_off';
        });

        document.getElementById('btn-export-zip').addEventListener('click', async () => {
            const labelEl = document.getElementById('export-zip-label');
            const bannerText = document.getElementById('banner-text');
            try {
                if (labelEl) labelEl.textContent = 'Bundling...';
                const fullHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

                const netlifyToml = [
                    '[build]',
                    '  publish = "."',
                    '',
                    '[[headers]]',
                    '  for = "/*"',
                    '  [headers.values]',
                    '    X-Frame-Options = "SAMEORIGIN"',
                    '    X-Content-Type-Options = "nosniff"',
                    '    Cache-Control = "public, max-age=3600"'
                ].join('\n');

                const readmeMd = [
                    '# Dejarik: Star Wars 3D Wizard\'s Chess (Marble vs. Obsidian)',
                    '',
                    'A playable single-file 3D Star Wars Wizard\'s Chess web application built with Material Design 3 standards and Three.js.',
                    '',
                    '## Features',
                    '- **32 Sculpted Star Wars Characters:** White Carrara Marble (Light Side) vs. Volcanic Obsidian (Dark Side).',
                    '- **Choreographed Combat & Shatter Physics:** Custom idle, glide, lightsaber swing, blaster bolt, and kinetic stone-shatter animations.',
                    '- **Self-Contained FIDE Chess Engine & Sith Droid AI:** Full legal move validation, castling, en passant, check/checkmate, and AI opponent.',
                    '',
                    '## Quick Deploy (Antigravity / Netlify / GitHub Pages)',
                    '- **Netlify Drop:** Drag this unzipped folder straight into https://app.netlify.com/drop',
                    '- **Netlify CLI:** Run `npx netlify-cli deploy --prod --dir=.`',
                    '- **GitHub CLI:** Run `gh repo create star-wars-wizards-chess --public --source=. --remote=origin --push`'
                ].join('\n');

                if (typeof JSZip !== 'undefined') {
                    const zip = new JSZip();
                    zip.file('index.html', fullHtml);
                    zip.file('netlify.toml', netlifyToml);
                    zip.file('README.md', readmeMd);

                    const blob = await zip.generateAsync({ type: 'blob' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'star-wars-wizards-chess-deploy.zip';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    bannerText.textContent = 'Downloaded star-wars-wizards-chess-deploy.zip (includes index.html, netlify.toml & README.md)!';
                } else {
                    const blob = new Blob([fullHtml], { type: 'text/html' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'index.html';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    bannerText.textContent = 'Downloaded index.html ready for deployment!';
                }
            } catch (err) {
                bannerText.textContent = 'Use the Download button in the top-right preview bar to save the HTML file.';
            } finally {
                if (labelEl) labelEl.textContent = 'Export .ZIP';
            }
        });

        function resetMatch() {
            if (isAnimatingAction) return;
            chess.reset();
            capturedByLight = 0;
            capturedByDark = 0;
            selectedSquare = null;
            clearHighlights();
            syncPiecesWithBoard();
            updateUIStatus();
            document.getElementById('modal-overlay').classList.add('hidden');
            document.getElementById('modal-overlay').classList.remove('flex');
            document.getElementById('banner-text').textContent = 'New battle initialized. Light Side (White Marble) commands first.';
        }

        document.getElementById('btn-reset').addEventListener('click', resetMatch);
        document.getElementById('modal-btn-restart').addEventListener('click', resetMatch);

        function handleViewportResize() {
            const w = container.clientWidth || window.innerWidth;
            const h = container.clientHeight || window.innerHeight;
            if (w > 0 && h > 0) {
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
                renderer.setSize(w, h);
            }
        }

        window.addEventListener('resize', handleViewportResize);
        if (window.ResizeObserver) {
            new ResizeObserver(handleViewportResize).observe(container);
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05);
            const elapsedTime = clock.getElapsedTime();

            // 1. Smoothly Interpolate Camera Orbit
            cameraState.theta += (cameraState.targetTheta - cameraState.theta) * 0.09;
            cameraState.phi += (cameraState.targetPhi - cameraState.phi) * 0.09;
            cameraState.radius += (cameraState.targetRadius - cameraState.radius) * 0.09;

            camera.position.x = cameraState.radius * Math.sin(cameraState.phi) * Math.sin(cameraState.theta);
            camera.position.y = cameraState.radius * Math.cos(cameraState.phi);
            camera.position.z = cameraState.radius * Math.sin(cameraState.phi) * Math.cos(cameraState.theta);
            camera.lookAt(0, 0.5, 0);

            // 2. Custom Idle Animations for All 32 Sculpted Pieces
            Object.values(pieceMeshes).forEach(piece => {
                if (currentChoreography && piece === currentChoreography.attackerMesh) return;

                const { bodyGroup, weaponPivot, type, idleSeed } = piece.userData;
                const phase = elapsedTime * 2.2 + idleSeed;

                if (type === 'k' || type === 'q') {
                    bodyGroup.position.y = Math.sin(phase) * 0.06 + 0.04;
                } else {
                    bodyGroup.position.y = Math.abs(Math.sin(phase * 0.85)) * 0.03;
                }

                weaponPivot.rotation.z = Math.sin(phase * 0.9) * 0.06;
            });

            // 3. Pulse Legal Move Highlight Rings
            Object.values(highlightMeshes).forEach(hl => {
                if (hl.visible) {
                    const scale = 0.92 + Math.sin(elapsedTime * 5) * 0.08;
                    hl.children[0].scale.set(scale, scale, 1);
                }
            });

            // 4. Update Active Move / Attack / Shatter Choreography
            if (currentChoreography) {
                const c = currentChoreography;
                c.elapsed += dt;
                const progress = Math.min(c.elapsed / c.duration, 1);

                if (!c.isCapture) {
                    const ease = progress < 0.5
                        ? 2 * progress * progress
                        : 1 - Math.pow(-2 * progress + 2, 2) / 2;
                    c.attackerMesh.position.lerpVectors(c.startPos, c.targetPos, ease);
                    c.attackerMesh.position.y = Math.sin(progress * Math.PI) * 0.35;
                } else {
                    if (progress < 0.55) {
                        const pA = progress / 0.55;
                        const stopFraction = c.isRanged ? 0.35 : 0.76;
                        const strikeSpot = new THREE.Vector3().lerpVectors(c.startPos, c.targetPos, stopFraction);
                        c.attackerMesh.position.lerpVectors(c.startPos, strikeSpot, pA);
                        c.attackerMesh.userData.weaponPivot.rotation.x = -0.85 * pA;
                    } else if (progress < 0.78) {
                        const pB = (progress - 0.55) / 0.23;
                        c.attackerMesh.userData.weaponPivot.rotation.x = -0.85 + pB * 2.15;

                        if (c.isRanged && !c.boltSpawned) {
                            c.boltSpawned = true;
                            soundFX.playBlasterBolt();
                            spawnEnergyBolt(c.attackerMesh.position, c.targetPos, c.charData.saberColor);
                        } else if (!c.isRanged && !c.boltSpawned) {
                            c.boltSpawned = true;
                            soundFX.playSaberSwing();
                        }

                        if (pB > 0.42 && !c.shattered && c.defenderMesh) {
                            c.shattered = true;
                            soundFX.playStoneShatter();
                            spawnShatterExplosion(c.defenderMesh.position, c.defenderMesh.userData.color);
                            c.defenderMesh.visible = false;
                        }
                    } else {
                        const pC = (progress - 0.78) / 0.22;
                        c.attackerMesh.position.lerp(c.targetPos, pC * 0.45);
                        c.attackerMesh.userData.weaponPivot.rotation.x = THREE.MathUtils.lerp(1.3, 0.2, pC);
                    }
                }

                if (progress >= 1) {
                    finalizeChoreography(c);
                }
            }

            // 5. Update Shattered Marble & Obsidian Shards Physics
            for (let i = activeShards.length - 1; i >= 0; i--) {
                const s = activeShards[i];
                s.age += dt;
                if (s.age >= s.maxLife) {
                    scene.remove(s.mesh);
                    activeShards.splice(i, 1);
                    continue;
                }

                s.velocity.y -= 15.5 * dt;
                s.mesh.position.addScaledVector(s.velocity, dt);
                s.mesh.rotation.x += s.rotVel.x * dt;
                s.mesh.rotation.y += s.rotVel.y * dt;
                s.mesh.rotation.z += s.rotVel.z * dt;

                if (s.mesh.position.y < 0.08) {
                    s.mesh.position.y = 0.08;
                    s.velocity.y *= -0.42;
                    s.velocity.x *= 0.72;
                    s.velocity.z *= 0.72;
                }

                const lifeRatio = 1 - s.age / s.maxLife;
                if (lifeRatio < 0.3) {
                    s.mesh.scale.setScalar(lifeRatio / 0.3);
                }
            }

            // 6. Update Blaster Bolts & Shockwave Rings
            for (let i = activeBolts.length - 1; i >= 0; i--) {
                const b = activeBolts[i];
                b.age += dt;
                const prog = b.age / b.maxLife;
                if (prog >= 1) {
                    scene.remove(b.mesh);
                    activeBolts.splice(i, 1);
                    continue;
                }
                if (b.type === 'bolt') {
                    b.mesh.position.lerpVectors(b.start, b.end, prog);
                } else if (b.type === 'shockwave') {
                    const scale = 1 + prog * 6.5;
                    b.mesh.scale.set(scale, scale, 1);
                    b.mat.opacity = 0.9 * (1 - prog);
                }
            }

            renderer.render(scene, camera);
        }

        function bootstrapHolochess() {
            handleViewportResize();
            syncPiecesWithBoard();
            updateUIStatus();
            animate();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', bootstrapHolochess);
        } else {
            bootstrapHolochess();
        }
    </script>
